<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Kalurahan Kanigoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-blue-800 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="font-bold text-lg">Admin Pelayanan Kanigoro</h1>
    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm font-medium">
      Keluar
    </button>
  </nav>

  <!-- Konten Utama -->
  <main class="max-w-6xl mx-auto p-6">
    <h2 class="text-xl font-semibold text-slate-800 mb-4">Daftar Pengajuan Surat Warga</h2>

    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-100 text-slate-600 text-sm border-b">
            <th class="p-3">Kode</th>
            <th class="p-3">Nama & NIK</th>
            <th class="p-3">Jenis Surat</th>
            <th class="p-3">Berkas</th>
            <th class="p-3">Status</th>
            <th class="p-3">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPengajuan" class="text-sm divide-y">
          <!-- Data dari Supabase nanti masuk di sini -->
          <tr>
            <td colspan="6" class="p-6 text-center text-slate-400">Belum ada data pengajuan.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
